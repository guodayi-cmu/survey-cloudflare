<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1300" viewBox="0 0 2000 1300" font-family="PingFang SC, Hiragino Sans GB, sans-serif">
  <defs>
    <marker id="arrB" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2a78d6"/></marker>
    <marker id="arrA" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#1baf7a"/></marker>
    <marker id="arrO" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#eb6834"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12" flood-color="#0b0b0b"/></filter>
  </defs>
  <rect width="2000" height="1300" fill="#fcfcfb"/>

  <!-- 泳道背景 -->
  <rect x="40" y="40" width="1920" height="360" rx="18" fill="#f2f4f8"/>
  <rect x="40" y="470" width="1920" height="440" rx="18" fill="#eaf1fb"/>
  <rect x="40" y="980" width="1920" height="280" rx="18" fill="#f6f3ec"/>
  <text x="64" y="78" font-size="26" font-weight="bold" fill="#0b0b0b">受访者层</text>
  <text x="64" y="106" font-size="17" fill="#52514e">无需登录 · 不收集任何身份信息 · 三种可选填写路径</text>
  <text x="64" y="508" font-size="26" font-weight="bold" fill="#0b0b0b">Cloudflare 全球连通云（基础设施层）</text>
  <text x="64" y="536" font-size="17" fill="#52514e">经独立第三方审计的信息安全与隐私管理体系：ISO 27001 / 27701 / 27018、SOC 2 Type II、C5:2020；欧盟云行为准则在册成员</text>
  <text x="64" y="1018" font-size="26" font-weight="bold" fill="#0b0b0b">实践团队（数据控制者）</text>
  <text x="64" y="1046" font-size="17" fill="#52514e">仅持有加密导出口令 · 明文数据仅存在于本地 · 全程不接入任何 AI 处理</text>

  <!-- 受访者节点 -->
  <g filter="url(#sh)">
    <rect x="140" y="140" width="300" height="180" rx="14" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
  </g>
  <text x="290" y="210" text-anchor="middle" font-size="30" font-weight="bold" fill="#0b0b0b">受访者</text>
  <text x="290" y="246" text-anchor="middle" font-size="18" fill="#52514e">浏览器 / 手机 / 微信内打开</text>
  <text x="290" y="278" text-anchor="middle" font-size="18" fill="#52514e">页面为 Cloudflare Pages 托管</text>

  <!-- 三条路径标识 -->
  <rect x="600" y="120" width="360" height="74" rx="10" fill="#e8f7f1" stroke="#1baf7a" stroke-width="1.6"/>
  <text x="780" y="152" text-anchor="middle" font-size="19" font-weight="bold" fill="#0d6b4f">路径 A · 在线填写</text>
  <text x="780" y="178" text-anchor="middle" font-size="15" fill="#52514e">HTTPS 加密传输 · IP 只留摘要</text>

  <rect x="600" y="230" width="360" height="74" rx="10" fill="#fff3ec" stroke="#eb6834" stroke-width="1.6"/>
  <text x="780" y="262" text-anchor="middle" font-size="19" font-weight="bold" fill="#8a3d14">路径 B · 端到端加密（纸质密文）</text>
  <text x="780" y="288" text-anchor="middle" font-size="15" fill="#52514e">浏览器本地 AES-256-GCM · 密钥不经网络</text>

  <rect x="600" y="340" width="360" height="60" rx="10" fill="#f0f0f0" stroke="#898781" stroke-width="1.6"/>
  <text x="780" y="378" text-anchor="middle" font-size="19" font-weight="bold" fill="#52514e">路径 C · 纯纸质</text>

  <!-- Cloudflare 内部组件 -->
  <g filter="url(#sh)">
    <rect x="140" y="560" width="380" height="150" rx="12" fill="#ffffff" stroke="#104281" stroke-width="1.8"/>
  </g>
  <text x="330" y="600" text-anchor="middle" font-size="22" font-weight="bold" fill="#0b0b0b">Pages · 静态站点</text>
  <text x="330" y="630" text-anchor="middle" font-size="16" fill="#52514e">问卷页面 · 六语言</text>
  <text x="330" y="656" text-anchor="middle" font-size="16" fill="#52514e">纸质加密/解密工具页</text>
  <text x="330" y="682" text-anchor="middle" font-size="16" fill="#52514e">18 岁年龄筛查（客户端）</text>

  <g filter="url(#sh)">
    <rect x="580" y="560" width="420" height="150" rx="12" fill="#ffffff" stroke="#104281" stroke-width="1.8"/>
  </g>
  <text x="790" y="600" text-anchor="middle" font-size="22" font-weight="bold" fill="#0b0b0b">Pages Functions · 无服务器函数</text>
  <text x="790" y="630" text-anchor="middle" font-size="16" fill="#52514e">/api/submit 校验 + 落库</text>
  <text x="790" y="656" text-anchor="middle" font-size="16" fill="#52514e">白名单校验 · 知情同意校验</text>
  <text x="790" y="682" text-anchor="middle" font-size="16" fill="#52514e">IP → 按天加盐 SHA-256 摘要</text>

  <g filter="url(#sh)">
    <rect x="1060" y="560" width="400" height="150" rx="12" fill="#ffffff" stroke="#104281" stroke-width="1.8"/>
  </g>
  <text x="1260" y="600" text-anchor="middle" font-size="22" font-weight="bold" fill="#0b0b0b">D1 · 无服务器 SQL 数据库</text>
  <text x="1260" y="630" text-anchor="middle" font-size="16" fill="#52514e">基于 SQLite · 欧盟辖区（jurisdiction=eu）</text>
  <text x="1260" y="656" text-anchor="middle" font-size="16" fill="#52514e">主实例位置：weur 西欧</text>
  <text x="1260" y="682" text-anchor="middle" font-size="16" fill="#52514e">欧盟管辖 · 面向全球对象的最大范围合规（以 GDPR 为基准）</text>

  <g filter="url(#sh)">
    <rect x="1520" y="560" width="380" height="150" rx="12" fill="#ffffff" stroke="#104281" stroke-width="1.8"/>
  </g>
  <text x="1710" y="600" text-anchor="middle" font-size="22" font-weight="bold" fill="#0b0b0b">网络与信任层</text>
  <text x="1710" y="630" text-anchor="middle" font-size="16" fill="#52514e">TLS 1.3 · DDoS 防护</text>
  <text x="1710" y="656" text-anchor="middle" font-size="16" fill="#52514e">WAF · 全球 CDN</text>
  <text x="1710" y="682" text-anchor="middle" font-size="16" fill="#52514e">透明请求头元数据最小化</text>

  <!-- 团队导出 -->
  <g filter="url(#sh)">
    <rect x="140" y="1080" width="380" height="140" rx="12" fill="#ffffff" stroke="#8a3d14" stroke-width="1.8"/>
  </g>
  <text x="330" y="1120" text-anchor="middle" font-size="22" font-weight="bold" fill="#0b0b0b">本地导出 /api/export.csv</text>
  <text x="330" y="1150" text-anchor="middle" font-size="16" fill="#52514e">需加密导出口令（token）</text>
  <text x="330" y="1176" text-anchor="middle" font-size="16" fill="#52514e">不含 IP 字段</text>

  <g filter="url(#sh)">
    <rect x="600" y="1080" width="420" height="140" rx="12" fill="#ffffff" stroke="#8a3d14" stroke-width="1.8"/>
  </g>
  <text x="810" y="1120" text-anchor="middle" font-size="22" font-weight="bold" fill="#0b0b0b">R 统计分析（本报告全部图表）</text>
  <text x="810" y="1150" text-anchor="middle" font-size="16" fill="#52514e">描述统计 · 卡方 / Fisher / McNemar</text>
  <text x="810" y="1176" text-anchor="middle" font-size="16" fill="#52514e">Spearman 相关 · 对应分析 · 词云</text>

  <g filter="url(#sh)">
    <rect x="1100" y="1080" width="420" height="140" rx="12" fill="#ffffff" stroke="#8a3d14" stroke-width="1.8"/>
  </g>
  <text x="1310" y="1120" text-anchor="middle" font-size="22" font-weight="bold" fill="#0b0b0b">纸面存档（路径 B/C）</text>
  <text x="1310" y="1150" text-anchor="middle" font-size="16" fill="#52514e">密文纸片 · 纯纸质问卷</text>
  <text x="1310" y="1176" text-anchor="middle" font-size="16" fill="#52514e">由团队本地解密 / 录入</text>

  <!-- 路径A 箭头:受访者 -> Functions -->
  <path d="M445,250 L620,250" stroke="#1baf7a" stroke-width="3" fill="none" marker-end="url(#arrA)"/>
  <text x="470" y="240" font-size="16" fill="#0d6b4f">HTTPS /api/submit</text>

  <!-- Functions -> D1 -->
  <path d="M1000,640 L1055,640" stroke="#2a78d6" stroke-width="3" fill="none" marker-end="url(#arrB)"/>
  <text x="1018" y="626" font-size="16" fill="#104281">写入</text>

  <!-- D1 -> 导出 -->
  <path d="M1270,715 L1270,760 L330,760 L330,1075" stroke="#2a78d6" stroke-width="2.6" fill="none" stroke-dasharray="8 6" marker-end="url(#arrB)"/>
  <text x="790" y="752" font-size="16" fill="#52514e">分析期内以匿名汇总形式导出（无 IP、无身份字段）</text>

  <!-- 路径B:受访者本地加密 -> 纸片 -> 团队 -->
  <path d="M300,330 L300,420 L1310,420 L1310,1075" stroke="#eb6834" stroke-width="2.6" fill="none" marker-end="url(#arrO)"/>
  <text x="640" y="412" font-size="16" fill="#8a3d14">打印密文纸片，线下寄送，服务器全程不接触明文</text>

  <!-- 路径C -->
  <path d="M330,400 L330,470 L1310,470 L1310,1075" stroke="#898781" stroke-width="2.4" fill="none" stroke-dasharray="5 5" marker-end="url(#arrB)"/>

  <!-- 隐私标注 -->
  <rect x="1100" y="120" width="760" height="320" rx="12" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.2"/>
  <text x="1130" y="160" font-size="21" font-weight="bold" fill="#0b0b0b">隐私设计要点（贯穿全流程）</text>
  <text x="1130" y="200" font-size="17" fill="#0b0b0b">① 数据最小化 —— 仅收集与研究目的直接相关的字段</text>
  <text x="1130" y="238" font-size="17" fill="#0b0b0b">② 匿名化 —— 不采集姓名 / 学号 / 手机号</text>
  <text x="1130" y="276" font-size="17" fill="#0b0b0b">③ IP 只留「IP+当天日期」的 SHA-256 摘要，推不回原文</text>
  <text x="1130" y="314" font-size="17" fill="#0b0b0b">④ 敏感题均可「不愿透露」，未满 18 岁自动拦截</text>
  <text x="1130" y="352" font-size="17" fill="#0b0b0b">⑤ 端到端加密路径密钥不经网络，服务器只见密文</text>
  <text x="1130" y="390" font-size="17" fill="#0b0b0b">⑥ 数据驻留欧盟管辖，面向全球对象实现最大范围合规</text>
  <text x="1130" y="416" font-size="17" fill="#0b0b0b">⑦ 知情同意 → 数据仅用于课程统计分析，不经任何 AI</text>
</svg>
